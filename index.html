<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Amai</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EDF0F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Amai">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --paper:#EDF0F2; --raise:#FFFFFF; --ink:#17202B; --mute:#67747F;
  --delft:#2F5D8C; --delft-deep:#1D3E63; --moss:#3F6B52; --clay:#8C3D2C;
  --line:#D2D9DE; --line-soft:#E1E6EA;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root{ --paper:#14181C; --raise:#1D242B; --ink:#E4E9ED; --mute:#8B98A3;
    --delft:#83AAD6; --delft-deep:#A8C6E4; --moss:#79B08F; --clay:#D08A76;
    --line:#2C353D; --line-soft:#232B32; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior:none;
}
#app{flex:1;display:flex;flex-direction:column;width:100%;max-width:34rem;margin:0 auto;padding:0 1.25rem}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.grow{flex:1;min-height:0}
.center{display:flex;flex-direction:column;justify-content:center}

/* ---- type ---- */
h1{font-family:var(--serif);font-weight:600;font-size:1.5rem;letter-spacing:-.01em;margin:0}
.word{font-family:var(--serif);font-weight:600;letter-spacing:-.02em;line-height:1.05;
  font-size:clamp(2.4rem,11vw,3.4rem);margin:0;overflow-wrap:break-word;hyphens:auto}
.word.long{font-size:clamp(1.7rem,7.5vw,2.5rem)}
.gloss{font-size:1.25rem;line-height:1.35;margin:.6rem 0 0}
.sentence{font-family:var(--serif);font-size:1.4rem;line-height:1.45;margin:0}
.meta{font-size:.82rem;color:var(--mute);margin:0}
.art{color:var(--mute);font-weight:400}
.dim{color:var(--mute)}
.tag{display:inline-block;font-size:.7rem;color:var(--mute);border:1px solid var(--line);
  border-radius:2px;padding:.05rem .35rem;vertical-align:.15em}

/* ---- header ---- */
header{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  padding:1.1rem 0 .9rem;border-bottom:1px solid var(--line-soft)}
.htitle{display:flex;align-items:baseline;gap:.5rem;min-width:0}
.back{font-size:1.6rem;line-height:1;color:var(--delft);padding:0 .3rem 0 0;
  margin-left:-.3rem;align-self:center}
.back:focus-visible{outline:2px solid var(--delft);outline-offset:2px;border-radius:4px}
header .n{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--mute)}

/* ---- buttons ---- */
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.btn{display:block;width:100%;padding:.85rem 1rem;border-radius:10px;border:1px solid var(--line);
  background:var(--raise);text-align:left;font-size:1.02rem;transition:transform .08s ease}
.btn:active{transform:scale(.985)}
.btn:focus-visible,button:focus-visible{outline:2px solid var(--delft);outline-offset:2px}
.btn.primary{background:var(--delft);border-color:var(--delft);color:#fff;text-align:center;font-weight:500}
.btn.mode{text-align:left;padding:.7rem .9rem}
.btn.mode b{display:block;font-weight:500;font-size:1.02rem}
.btn.mode small{display:block;font-size:.76rem;opacity:.72;margin-top:.1rem}

@media (prefers-color-scheme:dark){.btn.primary{color:#0F1418}}
.btn.ghost{background:transparent}
.btn.correct{border-color:var(--moss);box-shadow:inset 0 0 0 1px var(--moss)}
.btn.wrong{border-color:var(--clay);box-shadow:inset 0 0 0 1px var(--clay);opacity:.75}
.stack{display:flex;flex-direction:column;gap:.55rem}
.row{display:flex;gap:.5rem}
.row>*{flex:1}
.link{color:var(--delft);text-decoration:underline;text-underline-offset:3px;font-size:.9rem;padding:.4rem 0}
.grade{padding:.8rem .4rem;border-radius:10px;border:1px solid var(--line);background:var(--raise);
  text-align:center;font-size:.88rem;line-height:1.2}
.grade b{display:block;font-weight:500;font-size:.95rem}
.grade small{color:var(--mute);font-size:.72rem;font-variant-numeric:tabular-nums}
.bottom{padding:1rem 0 1.4rem;display:flex;flex-direction:column;gap:.55rem}
/* Hinweiszeile und Nebenknopf halten ihren Platz auch dann, wenn sie leer sind —
   so liegt der Hauptknopf in Frage und Auflösung an derselben Stelle. */
.bottom .note.pad{margin:0;text-align:center;min-height:1.24em}
.bottom .ghosted{visibility:hidden;pointer-events:none}

/* ---- misc ---- */
.chips{display:flex;gap:.3rem;overflow-x:auto;padding:.7rem 0 .5rem;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:.32rem .7rem;
  font-size:.8rem;background:var(--raise);color:var(--mute);white-space:nowrap}
.chip span{margin-left:.35rem;font-variant-numeric:tabular-nums;opacity:.7}
.chip.on{background:var(--delft);border-color:var(--delft);color:#fff}
@media (prefers-color-scheme:dark){.chip.on{color:#0F1418}}
.pool{border-top:1px solid var(--line-soft);padding:.6rem 0;display:flex;gap:.75rem;align-items:baseline}
.pool .nl{font-family:var(--serif);font-size:1.05rem}
.pool .de{flex:1;font-size:.88rem;color:var(--mute);text-align:right}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.note{font-size:.85rem;color:var(--mute);line-height:1.45}
input,textarea,select{font:inherit;color:inherit;background:var(--raise);border:1px solid var(--line);
  border-radius:8px;padding:.6rem .7rem;width:100%}
label{display:block;font-size:.8rem;color:var(--mute);margin:.7rem 0 .25rem}
.done{font-family:var(--serif);font-size:2rem;line-height:1.15;margin:0 0 .5rem}
hr{border:none;border-top:1px solid var(--line-soft);margin:1.2rem 0}
.bar{height:2px;background:var(--line-soft);border-radius:2px;overflow:hidden;margin-top:.5rem}
.boxrow{display:flex;align-items:center;gap:.6rem;padding:.28rem 0}
.boxlab{width:4.6rem;font-size:.82rem;color:var(--mute);flex:none}
.boxbar{flex:1;height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden}
.boxbar i{display:block;height:100%;background:var(--delft);border-radius:3px}
.boxn{width:3rem;text-align:right;font-size:.82rem;color:var(--mute);font-variant-numeric:tabular-nums}
.bar i{display:block;height:100%;background:var(--delft);transition:width .3s ease}
@media (max-width:400px){
  .grade{padding:.75rem .15rem}
  .grade b{font-size:.86rem}
  .grade small{font-size:.66rem}
  .row{gap:.35rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"><div class="screen center" style="padding-bottom:4rem"><p class="dim">Laden…</p></div></div>

<script src="fsrs.js"></script>
<script src="words.js"></script>
<script>
"use strict";
/* ============================================================
   Amai — Flämisch B1/B2
   Datenmodell in localStorage unter KEY. Export/Import als JSON.
   ============================================================ */
const VERSION = "v23";        // muss zu CACHE in sw.js passen
const KEY = "amai.v1";   // nicht umbenennen — daran hängt der gesamte Lernstand
let PERSIST = "unbekannt";
const app = document.getElementById("app");

// ---------- FSRS ----------
const { fsrs, generatorParameters, createEmptyCard, Rating, State } = window.FSRSLib;
let F = null;
function makeF(retention){ F = fsrs(generatorParameters({ request_retention: retention, enable_fuzz: true })); }

// ---------- Wortliste ----------
let WORDS = [];         // gelernte Wörter (mit Bedeutung), nach rank sortiert
function buildWords(st){
  const base = window.WORDS.map(w => ({...w}));
  const custom = (st.custom||[]).map(w => ({...w, custom:true}));
  WORDS = base.concat(custom).sort((a,b)=>a.rank-b.rank);
  WORDS.forEach((w,i)=>{ w.idx = i; if(w.key===undefined) w.key = w.nl; });
  buildGloss();
}
const byKey = k => WORDS.find(w=>w.key===k);
// Mehrere niederländische Wörter können dieselbe deutsche Bedeutung haben.
// Wer eines davon tippt, hat die Vokabel gewusst — auch wenn ein anderes gemeint war.
let BYGLOSS = new Map();
function buildGloss(){
  BYGLOSS = new Map();
  WORDS.forEach(w => {
    const k = w.de.toLowerCase();
    if(!BYGLOSS.has(k)) BYGLOSS.set(k, []);
    BYGLOSS.get(k).push(w.nl);
  });
}

// ---------- State ----------
const todayStr = () => new Date().toISOString().slice(0,10);
function freshState(){
  return { v:1, cards:{}, known:[], custom:[], lastExport:null,
           settings:{ sessionSize:7, newPerDay:8, retention:0.90 },
           daily:{ date:todayStr(), newDone:0 }, history:[] };
}
let S = freshState();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const p = JSON.parse(raw);
      S = Object.assign(freshState(), p);
      S.settings = Object.assign(freshState().settings, p.settings||{});
      for(const k in S.cards){
        const c = S.cards[k];
        c.due = new Date(c.due);
        if(c.last_review) c.last_review = new Date(c.last_review);
      }
    }
  }catch(e){ console.warn("State konnte nicht gelesen werden:", e); }
  if(S.daily.date !== todayStr()) S.daily = { date: todayStr(), newDone: 0 };
  makeF(S.settings.retention);
  buildWords(S);
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }
    catch(e){ alert("Speichern fehlgeschlagen: "+e.message); }
  }, 60);
}

// ---------- Hilfen ----------
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const POSNAME = { ww:"Verb", zn:"Substantiv", bn:"Adjektiv", bw:"Adverb" };
const hasCloze = w => w.cloze && w.cloze.indexOf("{") >= 0;
const blanks = c => c.replace(/\{[^}]+\}/g, "\u2009_____\u2009");
const filled = c => c.replace(/\{([^}]+)\}/g, "$1");
function fmtDue(d){
  const mins = (d - Date.now())/60000;
  if(mins < 60) return Math.max(1,Math.round(mins)) + " Min.";
  if(mins < 1440) return Math.round(mins/60) + " Std.";
  const days = mins/1440;
  if(days < 31) return Math.round(days) + " T.";
  if(days < 365) return Math.round(days/30.4) + " Mon.";
  return (days/365).toFixed(1) + " J.";
}
// Die fünf Listen sind eine Anzeige über dem FSRS-Zustand, kein eigener Mechanismus.
// „Noch n Wiederholungen" leitet sich aus der Stabilität ab: wie lange ein Wort
// hält, bevor die Erinnerung unter die Zielgenauigkeit fällt.
const BOXES = [
  { id:"neu",  label:"Neu" },
  { id:"b3",   label:"Noch 3" },
  { id:"b2",   label:"Noch 2" },
  { id:"b1",   label:"Noch 1" },
  { id:"kann", label:"Gekonnt" },
];
function boxOf(key){
  if(S.known.includes(key)) return "kann";
  const c = S.cards[key];
  if(!c) return "neu";
  if(c.stability >= 30) return "kann";
  if(c.stability >= 10) return "b1";
  if(c.stability >= 2)  return "b2";
  return "b3";
}
function boxCounts(){
  const n = { neu:0, b3:0, b2:0, b1:0, kann:0 };
  WORDS.forEach(w => n[boxOf(w.key)]++);
  return n;
}
function endOfDay(){ const d = new Date(); d.setHours(23,59,59,999); return d.getTime(); }
// Alles, was heute noch dran wäre, zählt zu heute — und jedes Wort nur einmal
// pro Tag, damit die Runde ein Ende hat.
function dueList(){
  const cut = endOfDay(), today = todayStr();
  return Object.keys(S.cards)
    .filter(k => byKey(k) && S.cards[k].due <= cut && S.cards[k].seenDay !== today)
    .sort((a,b)=> S.cards[a].due - S.cards[b].due);
}

// ---------- Routing ----------
let view = "home", ctx = {};
let WANT_FOCUS = false;   // wird von Session() gesetzt, von render() ausgeführt
function go(v, c={}){ view=v; ctx=c; render(); window.scrollTo(0,0); }
function render(){
  const fns = { home:Home, session:Session, sessionDone:SessionDone,
                drill:Drill, drillDone:DrillDone,
                pool:Pool, add:AddWord, data:Data };
  app.innerHTML = "";
  WANT_FOCUS = false;
  const node = fns[view]();
  if(view === "pool") LAST_BOX = ctx.box || LAST_BOX;
  on(node, "[data-back]", ()=> go(BACKTO[view] || "home", view === "add" ? { box: LAST_BOX } : {}));
  app.appendChild(node);
  // Synchron, nicht über setTimeout: sonst gilt es auf iOS nicht mehr als
  // Folge der Berührung und die Tastatur bleibt zu.
  if(WANT_FOCUS){
    const el = node.querySelector("#ans");
    if(el){ try{ el.focus({ preventScroll:true }); }catch(e){ try{ el.focus(); }catch(e2){} } }
  }
}
const BACKTO = { pool:"home", data:"home", add:"pool" };
// ctx überlebt den Wechsel nach „Wort hinzufügen" nicht, deshalb gemerkt:
let LAST_BOX = null;
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function on(root, sel, fn, ev="click"){ root.querySelectorAll(sel).forEach(n=>n.addEventListener(ev, fn)); }

function header(title, right, back){
  return `<header>
    <span class="htitle">${back?`<button class="back" data-back aria-label="Zurück">&#8249;</button>`:""}<h1>${esc(title)}</h1></span>
    <span class="n">${right||""}</span></header>`;
}

/* ============================================================
   HOME
   ============================================================ */
// Die Modi stehen untereinander. Ein weiterer ist ein weiterer Eintrag hier.
const MODES = [
  { id:"session", label:"Abfrage",
    hint: () => "Fällige Wiederholungen und neue Wörter",
    show: () => true },
  { id:"drill", label:"Einprägen",
    hint: () => `${boxCounts().b3} Wörter aus „Noch 3“ — Karte, Auswahl, Tippen`,
    show: () => boxCounts().b3 > 0 },
];
function backupAge(){
  if(!Object.keys(S.cards).length) return null;
  const since = S.lastExport || (S.history[0] && S.history[0].t) || Date.now();
  const days = Math.floor((Date.now() - since)/86400000);
  return days >= 30 ? days : null;
}
function Home(){

  let body;
  {
    const c = boxCounts(), done = c.kann, all = WORDS.length;
    const bar = BOXES.map(b => {
      const v = c[b.id]; if(!v) return "";
      return `<div class="boxrow"><span class="boxlab">${b.label}</span>
        <span class="boxbar"><i style="width:${Math.max(2, v/all*100)}%"></i></span>
        <span class="boxn">${v}</span></div>`;
    }).join("");
    body = `
      <div class="grow center">
        <p class="word">${done}<span class="dim" style="font-size:.4em"> / ${all}</span></p>
        <p class="gloss dim">gekonnt</p>
        <div style="margin-top:1.6rem">${bar}</div>
      </div>
      <div class="bottom">
        ${MODES.filter(m => m.show()).map(m => `
          <button class="btn mode" data-go="${m.id}">
            <b>${esc(m.label)}</b><small>${m.hint()}</small></button>`).join("")}
        <div class="row">
          <button class="btn ghost" data-go="pool">Pool</button>
          <button class="btn ghost" data-go="data">Daten</button>
        </div>
      </div>`;
  }
  const n = document.createElement("div"); n.className="screen";
  n.innerHTML = header("Amai") + body;
  on(n, "[data-go]", e => {
    const v = e.currentTarget.dataset.go;
    if(v==="session") startSession();
    else if(v==="drill") startDrill();
    else go(v);
  });
  return n;
}

/* ============================================================
   LERNRUNDE
   ============================================================ */
const R = {};
// Neue Wörter werden pro Runde zugeteilt, nicht pro Kalendertag. Wer eine Woche
// pausiert, hat nichts „verpasst" — das Tempo hängt daran, wie oft du übst.
// Der Anteil sinkt, wenn viel zu wiederholen ist oder die Trefferquote fällt.
function newShare(repsCount){
  const size = S.settings.sessionSize;
  let share = Math.max(0, size - repsCount);
  const recent = S.history.slice(-40);
  if(recent.length >= 15){
    const hit = recent.filter(h => h.r >= 3).length / recent.length;
    if(hit < 0.65) share = Math.round(share * 0.4);
    else if(hit < 0.80) share = Math.round(share * 0.7);
  }
  return Math.max(1, share);
}
// Neue Wörter kommen nur aus einem Fenster oberhalb deiner Grenze. Das Fenster
// wächst mit jeder Karte, die es in den Langzeitrhythmus geschafft hat — damit
// nicht nach zwei Wochen Rang 5000 ansteht.
function bandTop(){
  const solid = S.known.length + Object.keys(S.cards).filter(k => byKey(k) && S.cards[k].stability >= 10).length;
  // Beginnt bei den 500 häufigsten Wörtern, wächst mit jedem gefestigten Wort.
  return 500 + solid * 60;
}
// Die Warteschlange wird abgeleitet, nicht gespeichert: alles, was weder
// gekonnt noch im Umlauf ist, nach Häufigkeit geordnet.
function queued(){
  const known = new Set(S.known);
  return WORDS.filter(w => !known.has(w.key) && !S.cards[w.key]).map(w => w.key);
}
function nextNew(limit){
  const avail = queued(), top = bandTop();
  const inBand = avail.filter(k => byKey(k).rank <= top);
  return (inBand.length ? inBand : avail).slice(0, limit);
}
function startSession(){
  // Am längsten überfällige zuerst. Ein Rückstand wird nie angezeigt und nie
  // eingefordert — er läuft über die nächsten Runden von selbst ab.
  const due = dueList();
  const reps = due.slice(0, Math.round(S.settings.sessionSize * 0.7));
  const fresh = nextNew(newShare(reps.length));
  R.items = shuffle(reps.concat(fresh));
  R.i = 0; R.answered = 0; R.right = 0; R.retired = 0; R.repeats = {};
  if(!R.items.length) return go("home");
  prepCard(); go("session");
}
// Tippfehler von Wissenslücken trennen: Levenshtein-Distanz 1 gilt als Schreibfehler.
function lev(a,b){
  if(Math.abs(a.length-b.length) > 2) return 9;
  const m=a.length, n=b.length; let prev=[...Array(n+1).keys()], cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++)
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
// Satzzeichen zuerst entfernen, dann Leerraum — sonst bleibt ein Rest-Leerzeichen
// stehen und eine richtige Antwort wird als Tippfehler gewertet.
const norm = s => (s||"").toLowerCase().replace(/[.,!?;:"']/g," ").replace(/\s+/g," ").trim();
// Artikel darf mitgetippt werden; er wird getrennt geprüft.
function splitArticle(s){
  const m = /^(de|het)\s+(.+)$/.exec(s);
  return m ? { art:m[1], word:m[2] } : { art:null, word:s };
}
// Die Bewertung leitet sich aus der Antwort ab, nicht aus einer Selbsteinschätzung.
// Richtig und flott = Leicht, richtig aber zäh = Schwer, Schreibfehler = Schwer,
// falsch oder nicht gewusst = Nochmal.
function autoRating(verdict, ms, w, first){
  if(verdict === "wrong" || verdict === "idk" || verdict === "empty") return 1;
  if(verdict === "synonym") return 3;
  if(verdict === "typo" || verdict === "article" || verdict === "noarticle") return 2;
  if(first) return 4;
  const budget = 4000 + w.nl.length * 400;   // Lesen, überlegen, tippen
  return ms < budget ? 4 : ms < budget * 2.5 ? 3 : 2;
}
function judge(input, w){
  const got = splitArticle(norm(input)), want = norm(w.nl);
  if(!got.word) return { verdict:"empty" };
  // Bei Substantiven gehört der Artikel zum Wort. Fehlt er, ist die Antwort
  // unvollständig — das Geschlecht ist im Niederländischen nicht ableitbar.
  const needArt = w.pos === "zn" && w.art;
  if(got.word === want){
    if(needArt && !got.art) return { verdict:"noarticle" };
    if(needArt && got.art !== w.art) return { verdict:"article" };
    return { verdict:"right" };
  }
  if(lev(got.word, want) === 1) return { verdict:"typo" };
  const other = WORDS.find(x => norm(x.nl) === got.word);
  if(other && (BYGLOSS.get(w.de.toLowerCase())||[]).includes(other.nl))
    return { verdict:"synonym", other };
  return { verdict:"wrong", other };
}
function prepCard(){
  const key = R.items[R.i], w = byKey(key);
  R.key = key; R.w = w; R.mode = "produce";
  R.phase = "ask"; R.typed = ""; R.judged = null; R.shownAt = Date.now();
  R.isNew = !S.cards[key];
  const sched = F.repeat(S.cards[key] || createEmptyCard(new Date()), new Date());
  R.preview = { 1:sched[1].card.due, 2:sched[2].card.due, 3:sched[3].card.due, 4:sched[4].card.due };
}
// Ob ein Wort in dieser Runde noch einmal drankommt. Anzeige und Ablauf fragen
// dieselbe Funktion, sonst behauptet der Bildschirm etwas anderes als passiert.
const MAX_REPEATS = 1;
function willRequeue(key, rating){
  return rating === 1 && ((R.repeats && R.repeats[key]) || 0) < MAX_REPEATS;
}
// Bewertung anwenden: FSRS fortschreiben und in der Historie festhalten.
// Wird von beiden Modi benutzt.
function applyRating(key, rating){
  const prev = S.cards[key] || createEmptyCard(new Date());
  const out = F.repeat(prev, new Date())[rating];
  if(!S.cards[key]) S.daily.newDone++;
  out.card.seenDay = todayStr();
  S.cards[key] = out.card;
  S.history.push({ k:key, r:rating, t:Date.now() });
  if(S.history.length > 4000) S.history = S.history.slice(-3000);
  return out;
}
// Auswahlmöglichkeiten: das gesuchte Wort und drei aus derselben Wortart,
// möglichst ähnlich häufig.
function mcOptions(w){
  const same = WORDS.filter(x => x.pos === w.pos && x.key !== w.key);
  const near = same.sort((a,b) => Math.abs(a.rank-w.rank) - Math.abs(b.rank-w.rank)).slice(0,60);
  return shuffle([w, ...shuffle(near).slice(0,3)]);
}
function grade(rating){
  const key = R.key;
  // Wer ein Wort beim allerersten Kontakt auf Anhieb tippt, kennt es. Aussortieren.
  // Alles, was einmal danebenging, muss dagegen mehrere Abfragen überstehen.
  if(R.isNew && rating === 4 && R.judged && R.judged.verdict === "right"){
    S.known.push(key);
    S.triaged = (S.triaged || 0) + 1;
    R.retired++;
    R.answered++; R.right++;
    S.history.push({ k:key, r:4, t:Date.now() });
    if(S.history.length > 4000) S.history = S.history.slice(-3000);
    save(); R.i++;
    if(R.i >= R.items.length) return go("sessionDone");
    prepCard(); return render();
  }
  const out = applyRating(key, rating);
  R.answered++; if(rating >= 3) R.right++;
  // In derselben Runde wiederholt wird nur, was du gar nicht wusstest — also
  // „Weiss ich nicht" oder eine falsche Antwort. Ein Tippfehler oder ein falscher
  // Artikel zählt als gewusst und kommt erst beim nächsten Termin wieder.
  R.repeats = R.repeats || {};
  if(willRequeue(key, rating)){
    R.repeats[key] = (R.repeats[key]||0) + 1;
    R.items.push(key);
  }
  save();
  R.i++;
  if(R.i >= R.items.length) return go("sessionDone");
  prepCard(); render();
}
function Session(){
  const w = R.w, n = document.createElement("div"); n.className="screen";
  const prog = Math.round(R.i / R.items.length * 100);
  const head = header("Abfrage", `${R.i+1}/${R.items.length}${R.isNew?" · neu":""}`) +
    `<div class="bar"><i style="width:${prog}%"></i></div>`;
  const artLine = w.art ? `<span class="art">${w.art} </span>` : "";
  let body, bottom;

  if(R.phase === "ask"){
    body = `
      <div class="grow center">
        <p class="word${w.de.length>16?" long":""}">${esc(w.de)}</p>
        ${hasCloze(w) ? `<p class="sentence dim" style="margin-top:1.2rem;font-size:1.05rem">${esc(blanks(w.cloze))}</p>` : ""}
        <input id="ans" type="text" autocomplete="off" autocapitalize="none" autocorrect="off"
               spellcheck="false" lang="nl" enterkeyhint="go" placeholder="${w.art?"de/het + Wort":"tippen…"}"
               style="margin-top:1.4rem;font-family:var(--serif);font-size:1.3rem">
      </div>`;
    bottom = `<div class="bottom">
        <p class="note pad">&nbsp;</p>
        <button class="btn primary" data-check>Prüfen</button>
        <button class="btn ghost" data-idk>Weiss ich nicht</button>
      </div>`;

  } else {
    const v = R.judged.verdict;
    const rating = autoRating(v, R.elapsed, w, R.isNew);
    const retires = R.isNew && rating === 4 && v === "right";
    const colour = v==="right" ? "var(--moss)"
      : (v==="typo"||v==="article"||v==="noarticle"||v==="synonym") ? "var(--delft)" : "var(--clay)";
    const verdictText = {
      right:  "Richtig.",
      typo:   "Fast — achte auf die Schreibweise.",
      article: `Richtig, aber es heisst <b>${w.art} ${esc(w.nl)}</b>.`,
      noarticle: `Fast — mit Artikel: <b>${w.art} ${esc(w.nl)}</b>.`,
      synonym: `Auch richtig. Gesucht war <b>${w.art?w.art+" ":""}${esc(w.nl)}</b>.`,
      wrong:  R.judged.other ? `Das ist „${esc(R.judged.other.de)}“.` : "Leider nicht.",
      idk:    "",
      empty:  ""
    }[v] || "";
    body = `
      <div class="grow center">
        <p class="meta" style="color:${colour}">${verdictText || "&nbsp;"}</p>
        <p class="word${w.nl.length>12?" long":""}">${artLine}${esc(w.nl)}</p>
        <p class="gloss dim">${esc(w.de)}</p>
        ${R.typed && v!=="right" ? `<p class="note" style="margin-top:.6rem">Du hattest: ${esc(R.typed)}</p>` : ""}
        ${hasCloze(w) ? `<p class="sentence dim" style="margin-top:1.2rem;font-size:1.05rem">${esc(filled(w.cloze))}</p>` : ""}
      </div>`;
    bottom = `<div class="bottom">
        <p class="note pad">${
          retires ? "Gekonnt — kommt nicht mehr"
          : willRequeue(R.key, rating) ? "Kommt in dieser Runde noch einmal"
          : (R.preview[rating] - Date.now()) < 86400000 ? "Morgen wieder"
          : "Wieder in " + fmtDue(R.preview[rating])}</p>
        <button class="btn primary" data-g="${rating}">Weiter</button>
        <button class="btn ghost ghosted" aria-hidden="true" tabindex="-1">&nbsp;</button>
      </div>`;
  }

  n.innerHTML = head + body + bottom +
    `<div style="padding-bottom:1rem"><button class="link" data-quit>Runde beenden</button>
      <button class="link" data-skip style="float:right">Wort ist mir bekannt</button></div>`;

  const check = () => {
    const el = n.querySelector("#ans");
    R.typed = el ? el.value : "";
    R.elapsed = Date.now() - (R.shownAt || Date.now());
    R.judged = judge(R.typed, w);
    if(R.judged.verdict === "empty") return;
    R.phase = "shown"; render();
  };
  on(n,"[data-check]", check);
  on(n,"[data-idk]", ()=>{ R.typed=""; R.elapsed = 1e9; R.judged={verdict:"idk"}; R.phase="shown"; render(); });
  on(n,"[data-g]", e=> grade(Number(e.currentTarget.dataset.g)));
  on(n,"[data-quit]", ()=> go(R.answered ? "sessionDone" : "home"));
  on(n,"[data-skip]", ()=>{
    if(!confirm(`„${w.nl}“ dauerhaft als bekannt markieren?`)) return;
    S.known.push(w.key); delete S.cards[w.key];
    save(); R.i++;
    if(R.i >= R.items.length) return go("sessionDone");
    prepCard(); render();
  });

  // Tastatur führt durch die Runde: Enter prüft, Enter bestätigt.
  const inp = n.querySelector("#ans");
  if(inp){
    inp.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); check(); } });
    WANT_FOCUS = true;
  } else {
    n.addEventListener("keydown", e => {
      if(e.key !== "Enter") return;
      e.preventDefault();
      grade(autoRating(R.judged && R.judged.verdict, R.elapsed, R.w, R.isNew));
    });
    setTimeout(()=>{ try{ n.querySelector("[data-g]").focus(); }catch(e){} }, 30);
  }
  return n;
}
function SessionDone(){
  const n = document.createElement("div"); n.className="screen";
  const pct = R.answered ? Math.round(R.right/R.answered*100) : 0;
  n.innerHTML = header("Abfrage", "fertig") + `
    <div class="grow center">
      <p class="done">Fertig.</p>
      <p class="gloss dim">${R.answered === R.retired
        ? `${R.answered} ${R.answered===1?"Wort":"Wörter"} — alle auf Anhieb gewusst und aussortiert.`
        : `${R.answered} Karten, ${pct} % auf Anhieb gewusst${R.retired?`, ${R.retired} aussortiert`:""}.`}</p>
      <p class="note" style="margin-top:1.4rem">Der Rest kommt von allein wieder.</p>
    </div>
    <div class="bottom">
      <button class="btn ghost" data-go="home">Schliessen</button>
      <button class="btn primary" data-go="more">Weiter</button>
    </div>`;
  on(n,"[data-go]", e=> e.currentTarget.dataset.go==="more" ? startSession() : go("home"));
  return n;
}


/* ============================================================
   EINPRÄGEN — drei Durchgänge über dieselben Wörter aus „Noch 3“
   ============================================================ */
const D = {};
const PHASES = [
  { id:"card",   label:"Karte"  },
  { id:"choice", label:"Wählen" },
  { id:"type",   label:"Tippen" },
];
function drillPool(){ return WORDS.filter(w => boxOf(w.key) === "b3").map(w => w.key); }
function startDrill(){
  const pool = drillPool();
  if(!pool.length) return go("home");
  D.keys = shuffle(pool).slice(0, S.settings.sessionSize);
  D.phase = 0; D.i = 0; D.right = 0; D.typed = 0;
  prepDrill();
  go("drill");
}
function prepDrill(){
  D.flipped = false; D.chosen = null; D.input = ""; D.judged = null;
  D.shownAt = Date.now();
  D.w = byKey(D.keys[D.i]);
  if(PHASES[D.phase].id === "choice") D.options = mcOptions(D.w);
}
function drillNext(){
  D.i++;
  if(D.i >= D.keys.length){
    D.i = 0; D.phase++;
    if(D.phase >= PHASES.length) return go("drillDone");
  }
  prepDrill(); render();
}
function Drill(){
  const w = D.w, ph = PHASES[D.phase];
  const n = document.createElement("div"); n.className = "screen";
  const done = D.phase * D.keys.length + D.i;
  const head = header("Einprägen", `${ph.label} ${D.i+1}/${D.keys.length}`) +
    `<div class="bar"><i style="width:${Math.round(done/(D.keys.length*3)*100)}%"></i></div>`;
  const full = `${w.art?`<span class="art">${w.art} </span>`:""}${esc(w.nl)}`;
  let body, bottom;

  if(ph.id === "card"){
    body = `
      <div class="grow center" data-flip style="cursor:pointer">
        <p class="meta">${D.flipped ? "Niederländisch" : "Deutsch"}</p>
        <p class="word${(D.flipped?w.nl:w.de).length>12?" long":""}">${D.flipped ? full : esc(w.de)}</p>
        ${D.flipped ? `<p class="gloss dim">${esc(w.de)}</p>` : ""}
        <p class="note" style="margin-top:1.2rem">${D.flipped ? "Tippen dreht zurück" : "Tippen zum Umdrehen"}</p>
      </div>`;
    bottom = `<div class="bottom">
        <p class="note pad">&nbsp;</p>
        <button class="btn primary" ${D.flipped?"data-next":"data-flip"}>${D.flipped?"Weiter":"Umdrehen"}</button>
        <button class="btn ghost ghosted" aria-hidden="true" tabindex="-1">&nbsp;</button>
      </div>`;

  } else if(ph.id === "choice"){
    const picked = D.chosen !== null;
    body = `
      <div class="grow center">
        <p class="meta">Welches Wort passt?</p>
        <p class="word${w.de.length>16?" long":""}">${esc(w.de)}</p>
        <div class="stack" style="margin-top:1.5rem">
          ${D.options.map(o => {
            if(!picked) return `<button class="btn" data-pick="${esc(o.key)}">${o.art?`<span class="art">${o.art} </span>`:""}${esc(o.nl)}</button>`;
            const cls = o.key===w.key ? "btn correct" : (o.key===D.chosen ? "btn wrong" : "btn");
            return `<div class="${cls}" style="cursor:default">${o.art?`<span class="art">${o.art} </span>`:""}${esc(o.nl)}</div>`;
          }).join("")}
        </div>
      </div>`;
    bottom = `<div class="bottom">
        <p class="note pad">${picked ? (D.chosen===w.key ? "Richtig." : "Das richtige Wort ist markiert.") : "&nbsp;"}</p>
        <button class="btn primary" ${picked?"data-next":"disabled"} style="${picked?"":"opacity:.4"}">Weiter</button>
        <button class="btn ghost ghosted" aria-hidden="true" tabindex="-1">&nbsp;</button>
      </div>`;

  } else {
    const shown = D.judged !== null;
    body = `
      <div class="grow center">
        <p class="meta">${shown ? "" : "Auf Niederländisch"}&nbsp;</p>
        <p class="word${(shown?w.nl:w.de).length>14?" long":""}">${shown ? full : esc(w.de)}</p>
        ${shown ? `<p class="gloss dim">${esc(w.de)}</p>
          ${D.input && D.judged.verdict!=="right" ? `<p class="note" style="margin-top:.6rem">Du hattest: ${esc(D.input)}</p>`:""}` : `
          <input id="ans" type="text" autocomplete="off" autocapitalize="none" autocorrect="off"
                 spellcheck="false" lang="nl" enterkeyhint="go" placeholder="${w.art?"de/het + Wort":"tippen…"}"
                 style="margin-top:1.4rem;font-family:var(--serif);font-size:1.3rem">`}
      </div>`;
    const V = shown ? {
      right:"Richtig.", typo:"Fast — achte auf die Schreibweise.",
      article:`Richtig, aber es heisst ${w.art} ${esc(w.nl)}.`,
      noarticle:`Fast — mit Artikel: ${w.art} ${esc(w.nl)}.`,
      synonym:"Auch richtig.", idk:"", wrong:"Leider nicht.", empty:""
    }[D.judged.verdict] : "";
    bottom = `<div class="bottom">
        <p class="note pad">${V || "&nbsp;"}</p>
        <button class="btn primary" ${shown?"data-next":"data-check"}>${shown?"Weiter":"Prüfen"}</button>
        ${shown ? `<button class="btn ghost ghosted" aria-hidden="true" tabindex="-1">&nbsp;</button>`
                : `<button class="btn ghost" data-idk>Weiss ich nicht</button>`}
      </div>`;
  }

  n.innerHTML = head + body + bottom +
    `<div style="padding-bottom:1rem"><button class="link" data-quit>Abbrechen</button></div>`;

  on(n,"[data-flip]", ()=>{ D.flipped = !D.flipped; render(); });
  on(n,"[data-next]", ()=> drillNext());
  on(n,"[data-pick]", e=>{
    D.chosen = e.currentTarget.dataset.pick;
    if(D.chosen === w.key) D.right++;
    render();
  });
  const check = ()=>{
    const el = n.querySelector("#ans");
    D.input = el ? el.value : "";
    D.judged = judge(D.input, w);
    if(D.judged.verdict === "empty") return;
    // Nur der Tipp-Durchgang zählt für FSRS — Karte und Auswahl sind Übung.
    applyRating(D.keys[D.i], autoRating(D.judged.verdict, Date.now()-D.shownAt, w, false));
    D.typed++; save(); render();
  };
  on(n,"[data-check]", check);
  on(n,"[data-idk]", ()=>{
    D.input = ""; D.judged = { verdict:"idk" };
    applyRating(D.keys[D.i], 1); D.typed++; save(); render();
  });
  on(n,"[data-quit]", ()=> go(D.typed ? "drillDone" : "home"));
  const inp = n.querySelector("#ans");
  if(inp){
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); check(); } });
    WANT_FOCUS = true;
  }
  return n;
}
function DrillDone(){
  const n = document.createElement("div"); n.className="screen";
  const left = drillPool().length;
  n.innerHTML = header("Einprägen", "fertig") + `
    <div class="grow center">
      <p class="done">Durch.</p>
      <p class="gloss dim">${D.keys.length} Wörter dreimal gesehen: Karte, Auswahl, Tippen.</p>
      <p class="note" style="margin-top:1.4rem">${left ? `Noch ${left} Wörter im Fach „Noch 3“.` : "Das Fach „Noch 3“ ist leer."}</p>
    </div>
    <div class="bottom">
      <button class="btn ghost" data-go="home">Schliessen</button>
      ${left ? `<button class="btn primary" data-go="more">Noch eine Runde</button>` : ""}
    </div>`;
  on(n,"[data-go]", e => e.currentTarget.dataset.go==="more" ? startDrill() : go("home"));
  return n;
}

/* ============================================================
   POOL
   ============================================================ */
function Pool(){
  const n = document.createElement("div"); n.className="screen";
  const c = boxCounts();
  // Welches Fach gerade offen ist, merkt sich der Aufruf; so bleibt es beim
  // Zurückkommen aus „Wort hinzufügen" stehen.
  const cur = ctx.box || LAST_BOX || (c.neu ? "neu" : "kann");
  const box = BOXES.find(b => b.id === cur) || BOXES[0];

  const inBox = id => {
    const ks = WORDS.filter(w => boxOf(w.key) === id).map(w => w.key);
    if(id === "neu"){
      const pos = new Map(queued().map((k,i)=>[k,i]));
      return ks.sort((a,b2) => (pos.has(a)?pos.get(a):1e9)-(pos.has(b2)?pos.get(b2):1e9)
                                || byKey(a).rank - byKey(b2).rank);
    }
    if(id === "kann") return ks.sort((a,b2)=> byKey(a).rank - byKey(b2).rank);
    return ks.sort((a,b2)=> (S.cards[a]?S.cards[a].due:0) - (S.cards[b2]?S.cards[b2].due:0));
  };
  const LIMIT = 150;
  const row = k => {
    const w = byKey(k), card = S.cards[k];
    const right = card ? fmtDue(card.due) : "";
    const act = S.known.includes(k)
      ? `<button class="link" data-back-in="${esc(k)}" title="zurück in den Pool">↺</button>`
      : `<button class="link" data-drop="${esc(k)}" title="als gekonnt ablegen">✕</button>`;
    return `<div class="pool">
      <span class="nl">${w.art?`<span class="art">${w.art} </span>`:""}${esc(w.nl)}</span>
      <span class="de">${esc(w.de)}</span>
      <span class="meta" style="width:3.6rem;text-align:right">${right}</span>${act}</div>`;
  };
  const listFor = q => {
    let ks = inBox(cur);
    if(q){
      const t = q.toLowerCase();
      ks = ks.filter(k => { const w = byKey(k);
        return w.nl.toLowerCase().includes(t) || w.de.toLowerCase().includes(t); });
    }
    if(!ks.length) return `<p class="note">${q ? "Nichts gefunden." : "Dieses Fach ist leer."}</p>`;
    return ks.slice(0,LIMIT).map(row).join("")
      + (ks.length>LIMIT ? `<p class="note">… und ${ks.length-LIMIT} weitere. Nutze die Suche.</p>` : "");
  };

  n.innerHTML = header("Pool", `${c.kann}/${WORDS.length} gekonnt`, true) + `
    <div class="chips">
      ${BOXES.map(b=>`<button class="chip${b.id===cur?" on":""}" data-box="${b.id}">
        ${b.label}<span>${c[b.id]}</span></button>`).join("")}
    </div>
    <input id="q" type="search" placeholder="Suchen…" autocomplete="off"
           autocapitalize="none" autocorrect="off" spellcheck="false"
           style="margin:.1rem 0 .7rem">
    <div class="scroll" id="list">${listFor("")}</div>
    <div class="bottom">
      <button class="btn ghost" data-go="add">Wort hinzufügen</button>
    </div>`;

  const list = n.querySelector("#list");
  const redraw = () => { list.innerHTML = listFor(n.querySelector("#q").value.trim()); wire(); };
  function wire(){
    on(list,"[data-drop]", e=>{
      const k = e.currentTarget.dataset.drop;
      S.known.push(k); delete S.cards[k]; save(); go("pool", { box:cur });
    });
    on(list,"[data-back-in]", e=>{
      const k = e.currentTarget.dataset["backIn"];
      S.known = S.known.filter(x => x !== k); save(); go("pool", { box:cur });
    });
  }
  wire();
  // Nur die Liste neu zeichnen, sonst verliert das Suchfeld bei jedem
  // Tastendruck den Fokus.
  on(n,"#q", redraw, "input");
  on(n,"[data-box]", e=> go("pool", { box: e.currentTarget.dataset.box }));
  on(n,"[data-go]", e=> go(e.currentTarget.dataset.go));
  return n;
}

    <div class="scroll">
      <p class="note" style="margin:.9rem 0">Für Wörter, die dir im Alltag begegnen. Sie landen sofort im Pool.</p>
      <label for="f-nl">Niederländisch</label><input id="f-nl" autocapitalize="none" autocorrect="off">
      <label for="f-art">Artikel (nur Substantive)</label>
      <select id="f-art"><option value="">—</option><option>de</option><option>het</option></select>
      <label for="f-de">Deutsch</label><input id="f-de">
      <label for="f-pos">Wortart</label>
      <select id="f-pos"><option value="ww">Verb</option><option value="zn">Substantiv</option>
        <option value="bn">Adjektiv</option><option value="bw">Adverb</option></select>
      <label for="f-cl">Beispielsatz — Zielwort in geschweifte Klammern</label>
      <textarea id="f-cl" rows="2" placeholder="Ik {aarzelde} even."></textarea>
      <label for="f-rk">Häufigkeitsrang — 1 stellt das Wort ganz nach vorn</label>
      <input id="f-rk" type="number" inputmode="numeric" value="1">
    </div>

      <button class="btn primary" data-save>Speichern</button>
    </div>`;
  on(n,"[data-save]", ()=>{
    const g = id => n.querySelector("#"+id).value.trim();
    const nl = g("f-nl"), de = g("f-de");
    if(!nl || !de){ alert("Niederländisch und Deutsch sind nötig."); return; }
    if(WORDS.some(w=>w.nl===nl)){ alert(`„${nl}“ ist schon in der Liste.`); return; }
    const w = { nl, art:g("f-art")||null, de, pos:g("f-pos"), cloze:g("f-cl")||nl,
                rank:Number(g("f-rk"))||9000, key:nl };
    S.custom.push(w); buildWords(S);
    S.known = S.known.filter(k=>k!==nl);
    save(); go("pool", { box: LAST_BOX });
  });
  on(n,"[data-go]", e=> go(e.currentTarget.dataset.go));
  return n;
}

/* ============================================================
   DATEN & EINSTELLUNGEN
   ============================================================ */
function Data(){
  const n = document.createElement("div"); n.className="screen";
  const s = S.settings;
  n.innerHTML = header("Daten & Einstellungen", "", true) + `
    <div class="scroll">
      <label for="s-size">Karten pro Runde</label>
      <input id="s-size" type="number" inputmode="numeric" min="5" max="100" value="${s.sessionSize}">

      <p class="note" style="margin-top:.4rem">Neue Wörter kommen pro Runde, nicht pro Tag —
      eine Pause kostet dich nichts. Wie viele, hängt davon ab, wie viel gerade zu
      wiederholen ist und wie es läuft. Zurzeit kommen sie bis Rang ${bandTop()};
      diese Grenze wächst mit jedem gefestigten Wort.</p>
      <label for="s-ret">Zielgenauigkeit (FSRS, 0.80–0.97)</label>
      <input id="s-ret" type="number" step="0.01" min="0.8" max="0.97" value="${s.retention}">
      <p class="note" style="margin-top:.4rem">Höher heisst häufiger wiederholen. 0.90 ist der Normalfall.</p>
      <button class="btn" data-apply style="margin-top:.9rem">Übernehmen</button>
      <hr>
      <p class="note">„In Dateien speichern" öffnet das Teilen-Menü — von dort in
      iCloud Drive legen, dann liegt die Sicherung ausserhalb des Telefons.
      CSV ist zum Anschauen — jedes Wort mit Status und nächstem Termin,
      öffnet sich in Numbers oder Excel. JSON ist die Sicherung, mit der sich der Lernstand
      wiederherstellen lässt.</p>
      <p class="note">Alles liegt nur auf diesem Gerät. Als Web-App auf dem Home-Bildschirm ist
      der Lernstand vor Safaris Sieben-Tage-Aufräumung geschützt, aber nicht davor, dass das
      Icon gelöscht wird, der Speicher des Telefons vollläuft oder du auf ein neues Gerät
      wechselst. Speicherstatus: ${PERSIST}.
      ${S.lastExport ? `Letzte Sicherung: ${new Date(S.lastExport).toLocaleDateString("de-CH")}.`
                     : "Noch nie gesichert."}</p>
      <div class="stack" style="margin-top:.7rem">
        <button class="btn" data-progress>Fortschritt exportieren (CSV)</button>
        <button class="btn" data-export>Sicherung in Dateien speichern</button>
        <button class="btn" data-import>Sicherung einlesen</button>
        <button class="btn" data-update>Nach Aktualisierung suchen</button>
        <button class="btn" data-reset>Alles zurücksetzen</button>
      </div>
      <input type="file" id="f-imp" accept="application/json" style="display:none">
      <hr>
      <p class="note">${Object.keys(S.cards).length} aktive Karten · ${S.known.length} als bekannt
      abgelegt · ${queued().length} in der Warteschlange · ${S.history.length} Bewertungen
      insgesamt · Version ${VERSION}.</p>
    </div>
    <div class="bottom"></div>`;

  on(n,"[data-apply]", ()=>{
    s.sessionSize = Math.max(5, Number(n.querySelector("#s-size").value)||20);
    s.retention   = Math.min(0.97, Math.max(0.8, Number(n.querySelector("#s-ret").value)||0.9));
    makeF(s.retention); save(); render();
  });
  on(n,"[data-export]", async ()=>{
    const name = `amai-sicherung-${todayStr()}.json`;
    const text = JSON.stringify(S);
    // Über das Teilen-Menü landet die Datei direkt in „Dateien" und damit in
    // iCloud Drive. Wo das nicht geht, bleibt der normale Download.
    try{
      const file = new File([text], name, { type:"application/json" });
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        await navigator.share({ files:[file], title:"Amai-Sicherung" });
        S.lastExport = Date.now(); save(); render();
        return;
      }
    }catch(e){ if(e && e.name === "AbortError") return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], {type:"application/json"}));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    S.lastExport = Date.now(); save(); render();
  });
  on(n,"[data-progress]", ()=>{
    const q = v => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
    const rows = [["wort","artikel","deutsch","wortart","rang","prevBE","status","faellig",
                   "stabilitaet_tage","schwierigkeit","wiederholungen","rueckfaelle"].join(",")];
    const ST = {0:"neu",1:"lernen",2:"im Umlauf",3:"auffrischen"};
    Object.keys(S.cards).filter(byKey).sort((a,b)=>S.cards[a].due-S.cards[b].due).forEach(k=>{
      const w = byKey(k), c = S.cards[k];
      rows.push([w.nl,w.art,w.de,POSNAME[w.pos],w.rank,w.prevBE,ST[c.state]||c.state,
        new Date(c.due).toISOString().slice(0,10),
        (c.stability||0).toFixed(1),(c.difficulty||0).toFixed(1),c.reps,c.lapses].map(q).join(","));
    });
    queued().forEach(k=>{
      const w = byKey(k);
      rows.push([w.nl,w.art,w.de,POSNAME[w.pos],w.rank,w.prevBE,"wartet","","","","",""].map(q).join(","));
    });
    S.known.filter(byKey).forEach(k=>{
      const w = byKey(k);
      rows.push([w.nl,w.art,w.de,POSNAME[w.pos],w.rank,w.prevBE,"bekannt","","","","",""].map(q).join(","));
    });
    const blob = new Blob(["\uFEFF"+rows.join("\n")], {type:"text/csv;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `amai-fortschritt-${todayStr()}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
  });
  on(n,"[data-import]", ()=> n.querySelector("#f-imp").click());
  on(n,"#f-imp", e=>{
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        localStorage.setItem(KEY, rd.result);
        load(); go("home");
      }catch(err){ alert("Datei konnte nicht gelesen werden: "+err.message); }
    };
    rd.readAsText(f);
  }, "change");
  on(n,"[data-update]", e => checkUpdate(e.currentTarget));
  on(n,"[data-reset]", ()=>{
    if(!confirm("Wirklich alles löschen — Pool und Lernstand?")) return;
    localStorage.removeItem(KEY); S = freshState(); makeF(S.settings.retention); buildWords(S); go("home");
  });
  on(n,"[data-go]", e=> go(e.currentTarget.dataset.go));
  return n;
}

/* ============================================================
   Start
   ============================================================ */
load();
render();
// Bittet das System, diese Daten von der automatischen Aufräumung auszunehmen.
if(navigator.storage && navigator.storage.persist){
  navigator.storage.persisted().then(p => p || navigator.storage.persist())
    .then(ok => { PERSIST = ok ? "gesichert" : "nicht gesichert"; })
    .catch(()=>{});
}
// Aktualisierung: bei jedem Start nach einer neuen Fassung suchen. Übernimmt der
// neue Service Worker, wird einmal neu geladen — sonst zeigt die App weiter die
// zwischengespeicherte alte Fassung.
let SWREG = null, RELOADING = false;
if("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(RELOADING) return;
    RELOADING = true; location.reload();
  });
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js")
      .then(reg => { SWREG = reg; return reg.update(); })
      .catch(()=>{});
  });
}
function checkUpdate(btn){
  if(!SWREG){ alert("Aktualisierung nicht verfügbar — die App läuft ohne Service Worker."); return; }
  btn.textContent = "Suche…";
  SWREG.update()
    .then(()=> new Promise(r => setTimeout(r, 1200)))
    .then(()=>{
      if(SWREG.installing || SWREG.waiting){ btn.textContent = "Neue Fassung gefunden, lade neu…"; }
      else { btn.textContent = "Schon aktuell (" + VERSION + ")"; setTimeout(()=>render(), 1800); }
    })
    .catch(()=>{ btn.textContent = "Suche fehlgeschlagen"; });
}
</script>
</body>
</html>
